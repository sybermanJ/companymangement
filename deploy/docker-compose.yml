# Local development stack. Not for production: passwords are placeholders.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_dev_only
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      DATABASE_URL: postgres://cm_app:cm_app_dev_only@postgres/cm
      BIND: 0.0.0.0:8080
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://localhost:8080
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: "Hengtu <no-reply@hengtu.local>"
      RUST_LOG: info
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
