[package]
name = "cm-server"
description = "HTTP API server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
cm-domain.workspace = true
cm-store.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
axum-extra = { version = "0.10", features = ["cookie"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
time = "0.3"
futures-util = "0.3"
hmac = "0.12"
rust_decimal.workspace = true
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }

include_dir = { version = "0.7", optional = true }
lzma-rs = { version = "0.3", optional = true }
tar = { version = "0.4", optional = true, default-features = false }

[features]
# One self-contained executable: web app and PostgreSQL compiled in (D25).
# Needs `web/dist` built and CM_PG_TXZ pointing at a PostgreSQL archive (scripts/build-bundle.sh).
bundle = ["dep:include_dir", "dep:lzma-rs", "dep:tar"]

[dev-dependencies]
tokio = { workspace = true, features = ["sync"] }
sqlx = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hmac = "0.12"
sha2 = "0.10"

[lints]
workspace = true
